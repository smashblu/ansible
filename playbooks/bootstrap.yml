---
- name: Configure standard machine
  hosts: all
  become: true
  
  tasks:

  - name: Set hostname
    ansible.builtin.hostname:
      name: "{{ inventory_hostname }}"
  
  - name: Copy ssh key
    ansible.builtin.command: /usr/bin/ssh-copy-id -i ~/.ssh/ansible.pub luke@{{ ip_address }

  - name: Disable password authentication
    ansible.builtin.copy:
      src: /etc/ssh/sshd_config
      dest: /etc/ssh/sshd_config
      owner: root
      group: root
      mode: '644'
    notify: 
      - Restart ssh

  - name: Install standard packages
    ansible.builtin.package:
      name: "{{ packages }}"
      state: latest

  - name: Set timezone
    ansible.builtin.file:
      src: "/usr/share/zoneinfo/{{ system_timezone }}"
      dest: /etc/localtime
      state: link
      force: true
  
  - name: Ensure ssh is running
    ansible.builtin.service:
      name: sshd
      state: started
      enabled: true

  - name: Run ansible-pull continuously
    ansible.builtin.cron:
      name: ansible-pull
      user: root
      minute: "*/{{ pull_time }}"
      job: "/usr/bin/ansible-pull -o -U {{ pull_repo }} >> /var/log/ansible-pull.log"
      cron_file: ansible-pull

  - name: Touch bootstrapped file
    ansible.builtin.file:
      path: /opt/ansible/bootstrapped
      state: touch
      mode: '664'

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: sshd
        state: restarted

