---
- name: Configure standard machine
  hosts: all
  become: true
  gather_facts: true
  
  pre_tasks:
    - name: Check if bootstrapped
      ansible.builtin.stat:
        path: /etc/ansible/bootstrapped
      register: bootstrapped

    - name: Run bootstrap tasks
      ansible.builtin.include_tasks: task/bootstrap.yml
      when: not bootstrapped.stat.exists
  
  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: sshd
        state: restarted
