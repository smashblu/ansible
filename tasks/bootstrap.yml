---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Copy ssh key
  ansible.builtin.command: /usr/bin/ssh-copy-id -i ~/.ssh/ansible.pub luke@{{ ip_address }

- name: Disable password authentication
  ansible.builtin.copy:
    src: /etc/ssh/sshd_config
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '644'
  notify: 
    - Restart ssh

- name: Set timezone
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ system_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Ensure ssh is running
  ansible.builtin.service:
    name: sshd
    state: started
    enabled: true

- name: Touch bootstrapped file
  ansible.builtin.file:
    path: /opt/ansible/bootstrapped
    state: touch
    mode: '664'

- name: Reboot newly bootstrapped node
  ansible.builtin.reboot:
